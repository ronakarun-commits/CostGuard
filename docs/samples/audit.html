<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Waste audit</title><style>:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e4e4e0;--up:#c2410c;--down:#15803d;--accent:#2563eb}

@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d20;--ink:#ececee;--mute:#9a9aa2;--line:#2c2c31;--up:#fb923c;--down:#4ade80;--accent:#60a5fa}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

main{max-width:1080px;margin:0 auto;padding:32px 16px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:16px;margin:32px 0 8px}

.sub{color:var(--mute);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}

.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .n{color:var(--mute);font-size:12px}

.up{color:var(--up)}
.down{color:var(--down)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

th{font-size:12px;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}

svg{display:block;width:100%;height:80px}
.note{color:var(--mute);font-size:12px;margin-top:6px}
</style></head><body><main><h1>Waste audit</h1><div class='sub'>USD · generated 2026-10-10 15:51 UTC by costguard</div><div class='kpis'><div class='kpi'><div class='l'>Estimated saving / month</div><div class='v'>$271.28</div><div class='n'></div></div><div class='kpi'><div class='l'>Estimated saving / year</div><div class='v'>$3,255.36</div><div class='n'></div></div><div class='kpi'><div class='l'>Findings</div><div class='v'>8</div><div class='n'></div></div><div class='kpi'><div class='l'>High severity</div><div class='v'>2</div><div class='n'></div></div></div><h2>Savings by rule</h2><div class='wrap'><table><thead><tr><th class=''>Rule</th><th class=''>Findings</th><th class='num'>Monthly Saving</th></tr></thead><tbody><tr><td class=''>ec2-low-cpu</td><td class=''>2</td><td class='num'>$143.66</td></tr><tr><td class=''>ebs-unattached</td><td class=''>4</td><td class='num'>$109.25</td></tr><tr><td class=''>snapshot-orphaned</td><td class=''>2</td><td class='num'>$18.37</td></tr></tbody></table></div></main></body></html>
