<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>costguard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 24 C10 22 14 16 18 12 S26 6 29 5' fill='none' stroke='%232a78d6' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M18 12 L29 3 L29 14 Z' fill='%232a78d6' opacity='.35'/%3E%3C/svg%3E">
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --page: #f3f5f7;
  --surface: #ffffff;
  --ink: #121821;
  --ink-2: #4a5361;
  --muted: #7d8592;
  --grid: #e6e9ed;
  --axis: #c9ced6;
  --ring: rgba(18, 24, 33, 0.09);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --fan-outer: #cde2fb; --fan-inner: #9ec5f4; --fan-mid: #256abf;
  --wash: rgba(42, 120, 214, 0.10);
  --critical: #d03b3b; --good-text: #006300; --serious: #ec835a; --warning: #fab219; --good: #0ca30c;
  --focus: #2a78d6;
  --radius: 10px;
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0e1217; --surface: #161b22; --ink: #e9ecf0; --ink-2: #b4bcc8; --muted: #838c99;
    --grid: #232a33; --axis: #384250; --ring: rgba(255, 255, 255, 0.08);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --fan-outer: #1c3b60; --fan-inner: #2d65a8; --fan-mid: #b7d3f6;
    --wash: rgba(57, 135, 229, 0.16); --good-text: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0e1217; --surface: #161b22; --ink: #e9ecf0; --ink-2: #b4bcc8; --muted: #838c99;
  --grid: #232a33; --axis: #384250; --ring: rgba(255, 255, 255, 0.08);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --fan-outer: #173250; --fan-inner: #1f4f86; --fan-mid: #86b6ef;
  --wash: rgba(57, 135, 229, 0.16); --good-text: #0ca30c;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 19px; }
p { margin: 0; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
header.bar { border-bottom: 1px solid var(--ring); background: var(--surface); }
header.bar .wrap { display: flex; align-items: center; gap: 24px; min-height: 64px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; letter-spacing: -0.02em; }
.brand svg { width: 26px; height: 26px; }
.asof { color: var(--ink-2); font-size: 14px; }
.controls { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
label.budget { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
label.budget input { width: 130px; padding: 5px 10px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); font-variant-numeric: tabular-nums; }
.icon-btn { border: 1px solid var(--axis); background: none; border-radius: 8px; width: 34px; height: 32px; cursor: pointer; display: grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- hero ---------- */
.hero { padding: 36px 0 28px; display: grid; grid-template-columns: 320px 1fr; gap: 40px; align-items: start; }
.hero h1 { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
.hero .big { font-size: 56px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; }
.hero .sentence { margin-top: 12px; font-size: 16px; color: var(--ink-2); max-width: 32ch; }
.hero .sentence strong { color: var(--ink); font-weight: 600; }
.stats { margin-top: 26px; display: grid; gap: 14px; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding-top: 12px; border-top: 1px solid var(--ring); }
.stat dt { color: var(--ink-2); font-size: 14px; }
.stat dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.stat .sub { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.meter { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; border-radius: 4px; transition: width .4s ease; }
.fan-wrap { background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); padding: 18px 18px 8px; }
.fan-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 14px; height: 10px; border-radius: 2px; }
.key.line { height: 2px; border-radius: 1px; }

/* ---------- sections ---------- */
section.block { padding: 28px 0; border-top: 1px solid var(--ring); }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.block-head p { color: var(--ink-2); font-size: 14px; max-width: 70ch; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.two > div { min-width: 0; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink-2); font-size: 12.5px; }
.chart .lbl-strong { fill: var(--ink); font-size: 13px; font-weight: 600; }
.linkish { border: 0; background: none; color: var(--s1); cursor: pointer; padding: 0; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr.best td { background: var(--wash); }
tr.best td:first-child { box-shadow: inset 3px 0 0 var(--s1); padding-left: 10px; }
.table-scroll { overflow-x: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* waste rows */
.waste-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 12px 0; border-bottom: 1px solid var(--grid); }
.waste-row .what { font-weight: 550; }
.waste-row .detail { color: var(--ink-2); font-size: 13.5px; }
.waste-row .act { color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
.waste-row .amt { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.waste-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--grid); margin-top: 6px; }
.waste-bar i { display: block; height: 100%; border-radius: 2px; background: var(--s2); }

/* tooltip */
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); box-shadow: 0 6px 24px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.45; min-width: 140px; opacity: 0; transition: opacity .08s; }
#tip .t { font-weight: 600; margin-bottom: 2px; }
#tip .row { display: flex; justify-content: space-between; gap: 16px; }
#tip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* states */
.state { padding: 120px 0; text-align: center; color: var(--ink-2); }
.state h2 { margin-bottom: 8px; color: var(--ink); }
.state code { background: var(--surface); border: 1px solid var(--ring); padding: 2px 8px; border-radius: 6px; }
.pulse { display: inline-block; width: 60px; height: 3px; background: var(--grid); border-radius: 2px; overflow: hidden; margin-top: 18px; position: relative; }
.pulse::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--s1); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
form.key-form { display: inline-flex; gap: 8px; margin-top: 16px; }
form.key-form input { padding: 6px 10px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); width: 280px; }
form.key-form button { padding: 6px 14px; border: 0; border-radius: 8px; background: var(--ink); color: var(--surface); cursor: pointer; }
footer { padding: 28px 0 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--ring); }
.updating { opacity: .55; transition: opacity .2s; }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: 24px; }
  .two { grid-template-columns: 1fr; }
  .hero .big { font-size: 48px; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .controls { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 24 C10 22 14 16 18 12 S26 6 29 5" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round"/><path d="M18 12 L29 3 L29 14 Z" fill="var(--s1)" opacity=".35"/></svg>
      costguard
    </div>
    <div class="asof" id="asof"></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Currency">
        <button type="button" data-cur="USD" aria-pressed="true">USD</button>
        <button type="button" data-cur="INR" aria-pressed="false">INR</button>
      </div>
      <label class="budget">Monthly budget
        <input id="budget" inputmode="decimal" placeholder="none" aria-describedby="budget-hint">
      </label>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark theme">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 1.5v10a5 5 0 0 1 0-10Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite">
  <div class="state"><h2>Simulating 4,000 versions of this month</h2><p>This takes a few seconds.</p><div class="pulse"></div></div>
</main>
<div id="tip" role="tooltip"></div>

<script>
"use strict";
/* ============================== state & formatting ============================== */
const params = new URLSearchParams(location.search);
const store = {
  get(k) { try { return localStorage.getItem("cg:" + k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem("cg:" + k) : localStorage.setItem("cg:" + k, v); } catch {} },
};
let currency = store.get("currency") || "USD";
let budgetDisplay = store.get("budget:" + currency);
let data = null;
let apiKey = null;
try { apiKey = sessionStorage.getItem("cg:key"); } catch {}

const SYM = { USD: "$", INR: "₹" };
function nf(opts) { return new Intl.NumberFormat(currency === "INR" ? "en-IN" : "en-US", opts); }
function money(v, dp) {
  const d = dp ?? (Math.abs(v) >= 1000 ? 0 : 2);
  return (v < 0 ? "-" : "") + SYM[currency] + nf({ minimumFractionDigits: d, maximumFractionDigits: d }).format(Math.abs(v));
}
function compact(v) {
  const a = Math.abs(v), s = v < 0 ? "-" : "", y = SYM[currency];
  if (currency === "INR") {
    if (a >= 1e7) return s + y + trim(a / 1e7) + " Cr";
    if (a >= 1e5) return s + y + trim(a / 1e5) + " L";
    if (a >= 1e3) return s + y + trim(a / 1e3) + "K";
    return s + y + Math.round(a);
  }
  if (a >= 1e6) return s + y + trim(a / 1e6) + "M";
  if (a >= 1e3) return s + y + trim(a / 1e3) + "K";
  return s + y + Math.round(a);
}
function trim(x) { return x >= 100 ? Math.round(x).toString() : x.toFixed(x >= 10 ? 1 : 2).replace(/\.?0+$/, ""); }
function pct(v, signed) { if (v == null || !isFinite(v)) return "–"; const s = (v * 100).toFixed(Math.abs(v) < 0.1 ? 1 : 0) + "%"; return signed && v > 0 ? "+" + s : s; }
const DF = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short" });
const DFY = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });
const MF = new Intl.DateTimeFormat("en-GB", { month: "long" });
const MSF = new Intl.DateTimeFormat("en-GB", { month: "short" });
const dt = (s) => new Date(s + "T00:00:00");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shortSvc = (s) => s.replace("Amazon Elastic Compute Cloud - Compute", "EC2 compute").replace("Amazon Relational Database Service", "RDS")
  .replace("Amazon Simple Storage Service", "S3").replace("EC2 - Other", "EC2 storage (EBS)").replace("AmazonCloudWatch", "CloudWatch")
  .replace(/^Amazon /, "").replace(/^AWS /, "");

/* ============================== data loading ============================== */
async function load() {
  const app = document.getElementById("app");
  if (data) app.classList.add("updating");
  const q = new URLSearchParams({ currency });
  if (budgetDisplay) q.set("budget", budgetDisplay); // in the currency shown on screen
  try {
    const res = await fetch("v1/ui/overview?" + q, { headers: apiKey ? { "X-API-Key": apiKey } : {} });
    if (res.status === 401) return askKey();
    const body = await res.json();
    if (!res.ok) return showError(body.error || "Something went wrong.", body.hint);
    data = body;
    render();
  } catch (e) {
    showError("Can't reach the costguard server.", "Check that `costguard ui` is still running in your terminal.");
  } finally {
    app.classList.remove("updating");
  }
}
function showError(msg, hint) {
  document.getElementById("app").innerHTML =
    `<div class="state"><h2>${esc(msg)}</h2>${hint ? `<p>${esc(hint).replace(/`([^`]+)`/g, "<code>$1</code>")}</p>` : ""}</div>`;
}
function askKey() {
  document.getElementById("app").innerHTML = `<div class="state"><h2>This dashboard needs an API key</h2>
    <p>Enter one of the keys set in COSTGUARD_API_KEYS. It is kept only for this browser tab.</p>
    <form class="key-form"><input type="password" aria-label="API key" autocomplete="off" required><button>Open dashboard</button></form></div>`;
  const f = document.querySelector(".key-form");
  f.addEventListener("submit", (e) => { e.preventDefault(); apiKey = f.querySelector("input").value; try { sessionStorage.setItem("cg:key", apiKey); } catch {} load(); });
  f.querySelector("input").focus();
}

/* ============================== svg helpers ============================== */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, attrs = {}) { const t = el("text", { x, y, ...attrs }, parent); t.textContent = s; return t; }
function scaleLin(d0, d1, r0, r1) { const k = (r1 - r0) / ((d1 - d0) || 1); const f = (v) => r0 + (v - d0) * k; f.inv = (p) => d0 + (p - r0) / k; return f; }
function niceTicks(max, n = 4) {
  if (max <= 0) return [0];
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const out = []; for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}
function barPath(x, y, w, h, r, dir) { // rounded data-end only (dir: "up" | "right")
  r = Math.min(r, Math.abs(dir === "up" ? h : w) / 2, dir === "up" ? w / 2 : h / 2);
  if (h <= 0 || w <= 0) return "";
  if (dir === "up") return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}
const tip = document.getElementById("tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const pad = 14, r = tip.getBoundingClientRect();
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = 0; }
const row = (k, v, sw) => `<div class="row"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ""}${k}</span><b>${v}</b></div>`;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ============================== charts ============================== */
function fanChart(host) {
  const W = host.clientWidth, H = Math.max(280, Math.min(400, W * 0.5));
  host.innerHTML = "";
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Month-end projection fan chart" }, host);
  const m = { l: 56, r: 92, t: 14, b: 28 };
  const actual = data.fan.actual, bands = data.fan.bands, budget = data.meta.budget;
  const first = dt(actual[0].date), end = dt(data.fan.month_end);
  const days = Math.round((end - first) / 864e5) + 1;
  const ymax = Math.max(...bands.map((b) => b.p95), actual.length ? actual[actual.length - 1].cum : 0, budget || 0) * 1.06;
  const x = scaleLin(0, days - 1, m.l, W - m.r), y = scaleLin(0, ymax, H - m.b, m.t);
  const di = (s) => Math.round((dt(s) - first) / 864e5);
  // grid
  for (const t of niceTicks(ymax, 4)) {
    if (t > ymax) continue;
    el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t ? css("--grid") : css("--axis"), "stroke-width": 1 }, svg);
    txt(svg, m.l - 8, y(t) + 4, compact(t), { "text-anchor": "end" });
  }
  for (let i = 0; i < days; i += days > 20 ? 7 : 3) txt(svg, x(i), H - 8, DF.format(new Date(+first + i * 864e5)), { "text-anchor": "middle" });
  // bands start at the last actual point
  const last = actual[actual.length - 1];
  const pts = [{ date: last.date, p5: last.cum, p25: last.cum, p50: last.cum, p75: last.cum, p95: last.cum }, ...bands];
  const area = (lo, hi) => "M" + pts.map((p) => `${x(di(p.date))},${y(p[hi])}`).join("L") + "L" + pts.slice().reverse().map((p) => `${x(di(p.date))},${y(p[lo])}`).join("L") + "Z";
  if (bands.length) {
    el("path", { d: area("p5", "p95"), fill: css("--fan-outer") }, svg);
    el("path", { d: area("p25", "p75"), fill: css("--fan-inner") }, svg);
    el("path", { d: "M" + pts.map((p) => `${x(di(p.date))},${y(p.p50)}`).join("L"), fill: "none", stroke: css("--fan-mid"), "stroke-width": 2, "stroke-dasharray": "5 4", "stroke-linecap": "round" }, svg);
  }
  // budget line
  if (budget) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(budget), y2: y(budget), stroke: css("--critical"), "stroke-width": 1.5 }, svg);
    txt(svg, m.l + 8, y(budget) - 7, `Budget ${compact(budget)}`, { class: "lbl" });
  }
  // actual
  el("path", { d: "M" + actual.map((a) => `${x(di(a.date))},${y(a.cum)}`).join("L"), fill: "none", stroke: css("--s1"), "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  el("circle", { cx: x(di(last.date)), cy: y(last.cum), r: 5, fill: css("--s1"), stroke: css("--surface"), "stroke-width": 2 }, svg);
  // end labels (leader-free: p95 / median / p5 are well separated by construction of the fan)
  if (bands.length) {
    const e = bands[bands.length - 1], ex = x(di(e.date)) + 8;
    const labels = [["95% worst case", e.p95], ["Most likely", e.p50], ["5% best case", e.p5]];
    let prevY = -Infinity;
    for (const [name, v] of labels) {
      let ly = Math.max(y(v) + 4, prevY + 30); prevY = ly;
      txt(svg, ex, ly - 7, name, { class: "lbl" });
      txt(svg, ex, ly + 8, compact(v), { class: "lbl-strong" });
    }
  }
  // hover crosshair
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: css("--axis"), "stroke-width": 1, opacity: 0 }, svg);
  const hit = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(days - 1, Math.round(x.inv(px))));
    const day = new Date(+first + i * 864e5), iso = day.toISOString().slice(0, 10);
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
    const a = actual.find((p) => p.date === iso), b = bands.find((p) => p.date === iso);
    let h = `<div class="t">${DFY.format(day)}</div>`;
    if (a) h += row("Spent so far", money(a.cum), css("--s1"));
    if (b) h += row("Most likely by then", money(b.p50), css("--fan-mid")) + row("Likely range (25–75%)", `${compact(b.p25)} – ${compact(b.p75)}`) + row("Wide range (5–95%)", `${compact(b.p5)} – ${compact(b.p95)}`);
    if (budget) h += row("Budget", money(budget), css("--critical"));
    showTip(h, ev);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
}

function dailyChart(host) {
  const W = host.clientWidth, H = 230;
  host.innerHTML = "";
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Daily spend with unusual days marked" }, host);
  const m = { l: 52, r: 12, t: 10, b: 26 };
  const d = data.daily, n = d.length, ymax = Math.max(...d.map((p) => p.cost)) * 1.1;
  const x = scaleLin(0, n - 1, m.l, W - m.r), y = scaleLin(0, ymax, H - m.b, m.t);
  for (const t of niceTicks(ymax, 3)) { if (t > ymax) continue; el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t ? css("--grid") : css("--axis") }, svg); txt(svg, m.l - 8, y(t) + 4, compact(t), { "text-anchor": "end" }); }
  let lastM = "";
  d.forEach((p, i) => { const mo = p.date.slice(0, 7); if (mo !== lastM && dt(p.date).getDate() <= 7) { txt(svg, x(i), H - 6, MSF.format(dt(p.date)), { "text-anchor": "start" }); lastM = mo; } });
  // incident spans (behind the line)
  const idx = Object.fromEntries(d.map((p, i) => [p.date, i]));
  const spans = [];
  for (const inc of data.incidents) {
    let s = idx[inc.start] ?? 0, e = idx[inc.end] ?? n - 1;
    const r = el("rect", { x: x(s) - 3, y: m.t, width: Math.max(6, x(e) - x(s) + 6), height: H - m.t - m.b, fill: css("--critical"), opacity: 0.08, rx: 3 }, svg);
    spans.push({ s, e, inc, r });
  }
  el("path", { d: "M" + d.map((p, i) => `${x(i)},${y(p.cost)}`).join("L") + `L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z`, fill: css("--wash") }, svg);
  el("path", { d: "M" + d.map((p, i) => `${x(i)},${y(p.cost)}`).join("L"), fill: "none", stroke: css("--s1"), "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  for (const sp of spans) { // marker on the peak day of each incident
    let pk = sp.s; for (let i = sp.s; i <= sp.e; i++) if (d[i].cost > d[pk].cost) pk = i;
    el("circle", { cx: x(pk), cy: y(d[pk].cost), r: 4.5, fill: css("--critical"), stroke: css("--surface"), "stroke-width": 2 }, svg);
  }
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: css("--axis"), opacity: 0 }, svg);
  const dot = el("circle", { r: 4.5, fill: css("--s1"), stroke: css("--surface"), "stroke-width": 2, opacity: 0 }, svg);
  const hit = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", (ev) => {
    const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.round(x.inv((ev.clientX - r.left) * (W / r.width)))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(d[i].cost)); dot.setAttribute("opacity", 1);
    let h = `<div class="t">${DFY.format(dt(d[i].date))}</div>` + row("Total spend", money(d[i].cost), css("--s1"));
    for (const sp of spans) if (i >= sp.s && i <= sp.e) h += `<div class="muted" style="margin-top:4px">Unusual: ${esc(sp.inc.account)}, ${esc(shortSvc(sp.inc.service))} at ${sp.inc.ratio}x normal</div>`;
    showTip(h, ev);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); hideTip(); });
}

function serviceBars(host) {
  const rows = data.services.slice(0, 8), W = host.clientWidth, bh = 18, gap = 18, labelW = Math.min(170, W * 0.36);
  const H = rows.length * (bh + gap) + 6;
  host.innerHTML = "";
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Spend by service this month" }, host);
  const max = Math.max(...rows.map((r) => Math.max(r.mtd, r.prev)));
  const x = scaleLin(0, max, labelW, W - 120);
  rows.forEach((r, i) => {
    const y0 = i * (bh + gap) + 4;
    txt(svg, 0, y0 + bh / 2 + 4, shortSvc(r.name), { class: "lbl" });
    el("path", { d: barPath(labelW, y0, Math.max(2, x(r.mtd) - labelW), bh, 4, "right"), fill: css("--s1") }, svg);
    el("line", { x1: x(r.prev), x2: x(r.prev), y1: y0 - 3, y2: y0 + bh + 3, stroke: css("--ink"), "stroke-width": 2, "stroke-linecap": "round" }, svg);
    const ch = r.prev ? r.mtd / r.prev - 1 : null;
    txt(svg, W - 112, y0 + bh / 2 + 4, compact(r.mtd), { class: "lbl-strong" });
    const c = txt(svg, W, y0 + bh / 2 + 4, pct(ch, true), { "text-anchor": "end", class: "lbl" });
    const hit = el("rect", { x: 0, y: y0 - gap / 2, width: W, height: bh + gap, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", (ev) => showTip(`<div class="t">${esc(r.name)}</div>${row("This month so far", money(r.mtd), css("--s1"))}${row("Same days last month", money(r.prev), css("--ink"))}${row("Change", pct(ch, true))}`, ev));
    hit.addEventListener("pointerleave", hideTip);
  });
}

function accountColumns(host) {
  const am = data.accounts_monthly, accts = am.accounts, months = am.months, W = host.clientWidth, H = 250;
  const colors = ["--s1", "--s2", "--s3", "--s4"].map(css);
  const m = { l: 52, r: 8, t: 10, b: 26 };
  host.innerHTML = "";
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Monthly spend by account" }, host);
  const totals = months.map((mo) => accts.reduce((s, a) => s + mo.values[a], 0));
  const ymax = Math.max(...totals) * 1.08, y = scaleLin(0, ymax, H - m.b, m.t);
  const slot = (W - m.l - m.r) / months.length, bw = Math.min(24, slot * 0.6);
  for (const t of niceTicks(ymax, 3)) { if (t > ymax) continue; el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t ? css("--grid") : css("--axis") }, svg); txt(svg, m.l - 8, y(t) + 4, compact(t), { "text-anchor": "end" }); }
  months.forEach((mo, i) => {
    const cx = m.l + slot * i + slot / 2;
    let base = 0;
    accts.forEach((a, k) => {
      const v = mo.values[a], top = k === accts.length - 1;
      const y1 = y(base + v), y0 = y(base), h = y0 - y1 - (k ? 2 : 0); // 2px surface gap between segments
      if (h > 0) {
        if (top) el("path", { d: barPath(cx - bw / 2, y1, bw, h, 4, "up"), fill: colors[k % 4], opacity: mo.partial ? 0.45 : 1 }, svg);
        else el("rect", { x: cx - bw / 2, y: y1, width: bw, height: h, fill: colors[k % 4], opacity: mo.partial ? 0.45 : 1 }, svg);
      }
      base += v;
    });
    if (i % (months.length > 8 ? 2 : 1) === 0 || i === months.length - 1) txt(svg, cx, H - 8, MSF.format(dt(mo.month + "-01")), { "text-anchor": "middle" });
    const hit = el("rect", { x: cx - slot / 2, y: m.t, width: slot, height: H - m.t - m.b, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", (ev) => {
      let h = `<div class="t">${MF.format(dt(mo.month + "-01"))} ${mo.month.slice(0, 4)}${mo.partial ? " (so far)" : ""}</div>`;
      accts.slice().reverse().forEach((a) => { h += row(a, money(mo.values[a]), colors[accts.indexOf(a) % 4]); });
      showTip(h + row("Total", money(totals[i])), ev);
    });
    hit.addEventListener("pointerleave", hideTip);
  });
}
function accountTable() {
  const am = data.accounts_monthly;
  return `<div class="table-scroll"><table><thead><tr><th>Month</th>${am.accounts.map((a) => `<th class="r">${esc(a)}</th>`).join("")}<th class="r">Total</th></tr></thead><tbody>${
    am.months.map((mo) => `<tr><td>${mo.month}${mo.partial ? " (so far)" : ""}</td>${am.accounts.map((a) => `<td class="r">${money(mo.values[a], 0)}</td>`).join("")}<td class="r">${money(am.accounts.reduce((s, a) => s + mo.values[a], 0), 0)}</td></tr>`).join("")}</tbody></table></div>`;
}

function waterfall(host) {
  const steps = data.variance.steps, W = host.clientWidth, H = 230, m = { l: 56, r: 8, t: 22, b: 36 };
  host.innerHTML = "";
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Bridge from last month to this month" }, host);
  let run = 0; const bars = steps.map((s, i) => {
    const total = i === 0 || i === steps.length - 1;
    const from = total ? 0 : run, to = total ? s.amount : run + s.amount;
    run = total ? s.amount : to;
    return { ...s, from: Math.min(from, to), to: Math.max(from, to), total, up: s.amount >= 0 };
  });
  const lo = Math.min(...bars.filter((b) => !b.total).map((b) => b.from)), hi = Math.max(...bars.map((b) => b.to));
  // zoom the axis so small effects are visible on top of a large base, and say so
  const floor = Math.max(0, lo - (hi - lo) * 1.2);
  const y = scaleLin(floor, hi * 1.01, H - m.b, m.t), slot = (W - m.l - m.r) / bars.length, bw = Math.min(56, slot * 0.55);
  for (const t of niceTicks(hi, 4)) { if (t < floor || t > hi * 1.01) continue; el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: css("--grid") }, svg); txt(svg, m.l - 8, y(t) + 4, compact(t), { "text-anchor": "end" }); }
  bars.forEach((b, i) => {
    const cx = m.l + slot * i + slot / 2, top = y(b.to), bot = y(Math.max(b.from, floor));
    const fill = b.total ? css("--ink-2") : b.up ? css("--critical") : css("--good");
    el("rect", { x: cx - bw / 2, y: top, width: bw, height: Math.max(2, bot - top), rx: 4, fill }, svg);
    const label = b.total ? b.step.replace(" actual", "") : b.step[0].toUpperCase() + b.step.slice(1);
    txt(svg, cx, H - 14, label, { "text-anchor": "middle", class: "lbl" });
    txt(svg, cx, top - 6, b.total ? compact(b.amount) : (b.up ? "+" : "") + compact(b.amount), { "text-anchor": "middle", class: "lbl-strong" });
    if (i < bars.length - 1) { const nxt = y(b.total ? b.amount : (b.up ? b.to : b.from)); el("line", { x1: cx + bw / 2, x2: cx + slot - bw / 2, y1: nxt, y2: nxt, stroke: css("--axis") }, svg); }
    const hit = el("rect", { x: cx - slot / 2, y: m.t, width: slot, height: H - m.t - m.b, fill: "transparent" }, svg);
    const explain = { calendar: "More or fewer days in the month", volume: "Used more or less, at last month's prices", price: "Paid a different rate per unit", new: "Services that weren't used before", discontinued: "Services no longer used", unattributed: "Usage units are mixed, so this can't be split" }[b.step] || "";
    hit.addEventListener("pointermove", (ev) => showTip(`<div class="t">${esc(label)}</div>${row(b.total ? "Total" : "Effect", money(b.amount))}${explain ? `<div class="muted">${explain}</div>` : ""}`, ev));
    hit.addEventListener("pointerleave", hideTip);
  });
  txt(svg, m.l, 12, `Axis starts at ${compact(floor)} so the effects are visible`, { class: "lbl" });
}

/* ============================== page ============================== */
function render() {
  const d = data, k = d.kpis, meta = d.meta;
  const asOf = dt(meta.as_of), monthName = MF.format(asOf);
  document.getElementById("asof").textContent = `Data to ${DFY.format(asOf)}, ${meta.accounts.length} accounts${meta.sources.includes("synthetic") ? ", demo data" : ""}`;
  const bp = k.breach_probability;
  const meterColor = bp == null ? "" : bp >= 0.5 ? "var(--critical)" : bp >= 0.2 ? "var(--serious)" : "var(--good)";
  const vsLast = k.prev_mtd ? k.mtd / k.prev_mtd - 1 : null;
  const sentence = meta.budget
    ? `There's a <strong>${pct(bp)} chance</strong> ${monthName} ends above your ${compact(meta.budget)} budget.`
    : `In a bad month (1 in 20) it could reach <strong>${compact(k.car)}</strong>. Set a budget to see the chance of going over.`;
  const inc = d.incidents.filter((i) => dt(i.end) >= new Date(+asOf - 29 * 864e5));
  const app = document.getElementById("app");
  app.innerHTML = `
  <section class="hero">
    <div>
      <h1>${monthName} is heading for</h1>
      <div class="big num">${compact(k.expected)}</div>
      <p class="sentence">${sentence}</p>
      <dl class="stats">
        <div class="stat"><dt>Spent so far</dt><dd>${money(k.mtd)}</dd><span class="sub">${k.remaining_days} days to go${vsLast != null ? `, ${pct(vsLast, true)} vs the same days last month` : ""}</span></div>
        <div class="stat"><dt>Cost-at-Risk (95%)</dt><dd>${money(k.car)}</dd><span class="sub">Only 1 month in 20 should end higher</span></div>
        <div class="stat"><dt>Expected shortfall</dt><dd>${money(k.es)}</dd><span class="sub">Average of those worst 1-in-20 months</span></div>
        ${bp != null ? `<div class="stat"><dt>Chance of going over budget</dt><dd>${pct(bp)}</dd><div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(bp * 100)}" aria-label="Chance of going over budget"><i style="width:${Math.max(2, bp * 100)}%;background:${meterColor}"></i></div></div>` : ""}
      </dl>
    </div>
    <div class="fan-wrap">
      <div class="fan-head">
        <h2>Where ${monthName} could end up</h2>
        <div class="legend">
          <span><i class="key line" style="background:var(--s1)"></i>Spent so far</span>
          <span><i class="key" style="background:var(--fan-inner)"></i>Likely (half of outcomes)</span>
          <span><i class="key" style="background:var(--fan-outer)"></i>90% of outcomes</span>
          ${meta.budget ? `<span><i class="key line" style="background:var(--critical)"></i>Budget</span>` : ""}
        </div>
      </div>
      <div class="chart" id="fan"></div>
    </div>
  </section>

  <section class="block">
    <div class="block-head"><h2>Daily spend, last ${d.daily.length} days</h2>
      <p>${d.incidents.length ? `Red marks show ${d.incidents.length} stretch${d.incidents.length === 1 ? "" : "es"} of unusual spending.` : "No unusual spending in this period."}</p></div>
    <div class="chart" id="daily"></div>
  </section>

  <section class="block two">
    <div>
      <div class="block-head"><h2>This month by service</h2><p>Bar is this month so far. The black tick is the same days last month.</p></div>
      <div class="chart" id="svc"></div>
    </div>
    <div>
      <div class="block-head"><h2>Spend by account</h2><button class="linkish" id="acct-toggle" type="button" aria-pressed="false">Show as table</button></div>
      <div class="legend" style="margin-bottom:10px">${meta.accounts.map((a, i) => `<span><i class="key" style="background:var(--s${(i % 4) + 1})"></i>${esc(a)}</span>`).join("")}</div>
      <div class="chart" id="acct"></div>
    </div>
  </section>

  <section class="block">
    <div class="block-head"><h2>Unusual spending</h2><p>Compared with the same weekday over the previous four weeks. Only flagged when it's at least 20% and a meaningful amount above normal.</p></div>
    ${d.incidents.length ? `<div class="table-scroll"><table><thead><tr><th>When</th><th>Account</th><th>Service</th><th class="r">Peak vs normal</th><th class="r">Extra spend</th></tr></thead><tbody>${
      d.incidents.slice(0, 12).map((i) => `<tr><td>${DF.format(dt(i.start))}${i.end !== i.start ? ` to ${DF.format(dt(i.end))}` : ""}${dt(i.end) >= new Date(+asOf - 2 * 864e5) ? ` <span class="pill"><i style="background:var(--critical)"></i>ongoing</span>` : ""}</td><td>${esc(i.account)}</td><td>${esc(shortSvc(i.service))}</td><td class="r">${i.ratio}x</td><td class="r">${money(i.excess, 0)}</td></tr>`).join("")
    }</tbody></table></div>` : `<p class="ink2">Nothing unusual in the last ${d.daily.length} days.</p>`}
  </section>

  ${d.variance ? `<section class="block">
    <div class="block-head"><h2>Why the bill changed, ${esc(d.variance.title)}</h2><p>Splits the change into more days, more usage and higher prices. The effects add up exactly to the difference.</p></div>
    <div class="chart" id="bridge"></div>
  </section>` : ""}

  <section class="block two">
    <div>
      <div class="block-head"><h2>Waste you could switch off</h2><p>${money(d.waste.total, 0)} a month across ${d.waste.findings.length} items${d.waste.demo ? ", from the demo inventory" : ""}.</p></div>
      ${d.waste.findings.slice(0, 6).map((f) => `<div class="waste-row"><div><div class="what">${esc(f.title)}</div><div class="detail">${esc(f.detail)}</div></div><div class="amt">${money(f.saving, 0)}<div class="muted" style="font-weight:400;font-size:12px">a month</div></div><div class="waste-bar"><i style="width:${(f.saving / d.waste.findings[0].saving) * 100}%"></i></div><div class="act">${esc(f.action)}</div></div>`).join("")}
    </div>
    <div>
      <div class="block-head"><h2>Savings Plan options</h2><p>Each plan sized to stay profitable even in a bad usage scenario.</p></div>
      ${d.commitments.length ? (() => { const best = d.commitments.reduce((a, b) => (b.npv_p5 > a.npv_p5 ? b : a)); return `<div class="table-scroll"><table><thead><tr><th>Plan</th><th class="r">Commit per hour</th><th class="r">Saving a year</th><th class="r">Value today</th><th class="r">Chance of loss</th></tr></thead><tbody>${
        d.commitments.map((c) => `<tr class="${c === best ? "best" : ""}"><td>${esc(c.option)}${c === best ? `<div class="muted" style="font-size:12px">Best in a bad scenario</div>` : ""}</td><td class="r">${money(c.per_hour, 2)}</td><td class="r">${money(c.saving_per_year, 0)}</td><td class="r">${money(c.npv, 0)}</td><td class="r">${pct(c.p_loss)}</td></tr>`).join("")
      }</tbody></table></div><p class="muted" style="font-size:13px;margin-top:10px">Value today is the net present value at a 10% cost of capital. Commitments cover about ${pct(best.hedge_ratio)} of current usage.</p>`; })() : `<p class="ink2">Needs at least 60 days of compute spend.</p>`}
    </div>
  </section>

  <footer>Projections come from 4,000 simulated months, with bounds calibrated on how wrong past forecasts were. Hover any chart for exact numbers.</footer>`;

  draw();
  const tog = document.getElementById("acct-toggle");
  tog.addEventListener("click", () => {
    const on = tog.getAttribute("aria-pressed") !== "true";
    tog.setAttribute("aria-pressed", on); tog.textContent = on ? "Show as chart" : "Show as table";
    const host = document.getElementById("acct");
    if (on) host.innerHTML = accountTable(); else accountColumns(host);
  });
}
function draw() {
  if (!data) return;
  const g = (id) => document.getElementById(id);
  fanChart(g("fan")); dailyChart(g("daily")); serviceBars(g("svc"));
  const tog = g("acct-toggle");
  if (!tog || tog.getAttribute("aria-pressed") !== "true") accountColumns(g("acct"));
  if (data.variance) waterfall(g("bridge"));
}

/* ============================== controls ============================== */
const curBtns = document.querySelectorAll("[data-cur]");
function syncControls() {
  curBtns.forEach((b) => b.setAttribute("aria-pressed", b.dataset.cur === currency));
  const inp = document.getElementById("budget");
  inp.value = budgetDisplay || "";
  inp.placeholder = currency === "INR" ? "e.g. 2200000" : "e.g. 26000";
}
curBtns.forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.cur === currency) return;
  currency = b.dataset.cur; store.set("currency", currency);
  budgetDisplay = store.get("budget:" + currency);
  syncControls(); load();
}));
let bt;
document.getElementById("budget").addEventListener("input", (e) => {
  const v = e.target.value.replace(/[^0-9.]/g, "");
  budgetDisplay = v && Number(v) > 0 ? v : null;
  store.set("budget:" + currency, budgetDisplay);
  clearTimeout(bt); bt = setTimeout(load, 500);
});
document.getElementById("theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("theme", next); draw();
});
const savedTheme = store.get("theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 120); });
if (params.get("budget") && !budgetDisplay) budgetDisplay = params.get("budget");
syncControls(); load();
</script>
</body>
</html>
