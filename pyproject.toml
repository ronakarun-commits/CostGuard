[project]
name = "costguard"
version = "1.0.0"
description = "AWS FinOps and cost-risk toolkit: anomalies, forecasts, Cost-at-Risk, waste and finance analytics."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ronak", email = "ronakarun14@gmail.com" }]
requires-python = ">=3.12"
keywords = ["aws", "finops", "cloud-cost", "anomaly-detection", "forecasting", "risk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic-settings>=2.5",
    "rich>=13.7",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dashboard = [
    "streamlit>=1.38",
    "altair>=5",
]
all = ["costguard[api,dashboard]"]

[project.urls]
Repository = "https://github.com/your-github-username/costguard"
Documentation = "https://github.com/your-github-username/costguard#readme"

[project.scripts]
costguard = "costguard.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pandas-stubs>=3.0.5.260914",
    "boto3-stubs[budgets,ce,cloudwatch,ec2,sts]>=1.35",
    "moto[budgets,cloudwatch,ec2,sts]>=5.0",
    "scipy-stubs>=1.18.1.1",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------- ruff: lint + format ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "S",        # bandit (security)
]

allowed-confusables = ["–", "×", "α"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is how pytest works
# SQL there is built only from allow-listed constants; values always go through ? params
"src/costguard/storage/**" = ["S608"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["costguard"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["statsmodels.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["costguard.interfaces.dashboard_app"]
disallow_untyped_calls = false  # altair's fluent API is untyped

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -n auto --cov=costguard --cov-report=term-missing"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
omit = ["src/costguard/__main__.py"]  # exercised via subprocess in tests

[tool.coverage.report]
fail_under = 80
