[project]
name = "costguard"
version = "0.1.0"
description = "AWS FinOps and cost-risk toolkit: anomalies, forecasts, Cost-at-Risk, waste and finance analytics."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ronak", email = "ronakarun14@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic-settings>=2.5",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
costguard = "costguard.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pandas-stubs>=3.0.5.260914",
    "boto3-stubs[budgets,ce,cloudwatch,ec2,sts]>=1.35",
    "moto[budgets,cloudwatch,ec2,sts]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------- ruff: lint + format ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "S",        # bandit (security)
]

allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is how pytest works
# SQL there is built only from allow-listed constants; values always go through ? params
"src/costguard/storage/**" = ["S608"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["costguard"]
mypy_path = "src"

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=costguard --cov-report=term-missing"

[tool.coverage.run]
omit = ["src/costguard/__main__.py"]  # exercised via subprocess in tests

[tool.coverage.report]
fail_under = 80
